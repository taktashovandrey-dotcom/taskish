name: Assistant Push

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # daily at 01:00 UTC

jobs:
  assistant-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git user
        run: |
          git config user.name "Assistant CI"
          git config user.email "assistant@local"

      - name: Ensure assistant helper is executable
        run: |
          if [ -f .github/assistant/assistant-apply.sh ]; then chmod +x .github/assistant/assistant-apply.sh; fi

      - name: Run assistant apply script
        run: |
          if [ -f .github/assistant/assistant-apply.sh ]; then .github/assistant/assistant-apply.sh ; else echo "No assistant-apply.sh found"; fi

      - name: Create Pull Request for changes
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Assistant: apply changes"
          title: "Assistant: apply automated changes"
          body: |
            This PR was created automatically by the Assistant Push workflow.
            It applies files from `.assistant/pending/` so you can review before merging.
          base: ${{ github.ref_name }}
          branch: assistant/auto-${{ github.run_id }}
          labels: automated,assistant
